<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" width="520" height="260">
  <defs>
    <linearGradient id="s" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9edf2"/><stop offset=".25" stop-color="#b8c0ca"/><stop offset=".5" stop-color="#f4f6f9"/>
      <stop offset=".75" stop-color="#a9b2bd"/><stop offset="1" stop-color="#dfe4ea"/>
    </linearGradient>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="10" height="10" fill="none"/><line x1="0" y1="0" x2="0" y2="10" stroke="#ffffff" stroke-opacity=".35" stroke-width="3"/>
    </pattern>
    <pattern id="coins" width="74" height="64" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#8e98a4" stroke-opacity=".45" stroke-width="2">
        <circle cx="18" cy="18" r="11"/><circle cx="55" cy="48" r="11"/>
      </g>
      <g font-family="Georgia, serif" font-size="13" font-weight="700" fill="#8e98a4" fill-opacity=".55" text-anchor="middle">
        <text x="18" y="23">★</text><text x="55" y="53">$</text>
      </g>
    </pattern>
  </defs>
  <rect width="520" height="260" rx="12" fill="url(#s)"/>
  <rect width="520" height="260" rx="12" fill="url(#coins)"/>
  <rect width="520" height="260" rx="12" fill="url(#hatch)"/>
  <rect x="120" y="92" width="280" height="76" rx="38" fill="#7d8794" fill-opacity=".28"/>
  <text x="260" y="138" text-anchor="middle" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="34" font-weight="800" fill="#4d5560" letter-spacing="6">刮開這裡</text>
  <text x="260" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#5f6873" letter-spacing="5">SCRATCH HERE</text>
</svg>
